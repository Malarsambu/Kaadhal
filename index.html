<style>
:root{--bg:#eef1f2;--ink:#1d2a2e;--mute:#5d6e74;--acc:#3f6a8f;--line:#cfd8db;--fs:20px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#141d1f;--ink:#d9e2dc;--mute:#8ea09f;--acc:#7fa6c9;--line:#26343a;color-scheme:dark}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Newsreader",Georgia,"Times New Roman",serif;font-size:var(--fs);line-height:1.7}

#bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:3px;width:0;background:var(--acc);z-index:20}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;gap:.6rem;align-items:center;justify-content:space-between;padding:.6rem 1rem;font-size:16px;flex-wrap:wrap}

.card .n{font-size:5rem;line-height:1;color:var(--line);font-weight:600}
h1{font-size:2rem;line-height:1.2;margin:.2rem 0 .4rem;font-weight:600}

p{margin:0 0 1.1em}

figure{margin:2rem 0;position:relative;aspect-ratio:16/9;border-radius:6px;overflow:hidden;display:grid;place-items:center;
  background:linear-gradient(160deg,var(--line),var(--bg));color:var(--mute);font-size:.7em;text-align:center;padding:1rem}
figure img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.end{border-top:1px solid var(--line);margin-top:3rem;padding-top:1.5rem;display:flex;justify-content:space-between;gap:1rem;align-items:center;font-size:16px;flex-wrap:wrap}

footer{max-width:62ch;margin:0 auto;padding:1.5rem 1rem 3rem;border-top:1px solid var(--line);color:var(--mute);font-size:15px}

<script>
/* HOW TO ADD CONTENT: add scenes to a part. Each scene = { img: "p1s1.svg", text: [ "paragraph", "> spoken line" ] }.
   Lines starting with > are dialogue. Put image files in an images folder next to this file.
   When a part is ready, remove  soon:true  from it. */
var PARTS=[
{title:"The Recording",meta:"Part 1 of 5 · about 5 min read",hook:"The recording had one more minute. I haven’t played it yet.",scenes:[
 {img:"p1s1.svg",text:[
  "My grandfather Raghavan lived in Chennai for fifty years, but he kept a house in the hills that he never talked about. Once a year, on the same day, he drove up alone and came back quiet.",
  "When he died, the lawyer read the will in four minutes. The house comes to me. One condition: the east room upstairs stays locked.",
  "I wasn’t planning to argue. I was planning to sell."]},
 {img:"p1s2.svg",text:[
  "An old man was waiting at the gate with a torch, fog curling around his ankles.",
  "> “You are late. Raghavan sir always arrived before noon.”",
  "> “The ghat road was blocked. You must be Selvam.”",
  "> “Forty years I have kept these keys. Everything is clean. Except upstairs. I don’t go upstairs.”",
  "> “Why not?”",
  "> “Sir paid me not to.” He looked at the torch for a moment. “Rice is on the stove.”"]},
 {img:"p1s3.svg",text:[
  "Everything inside was old and tired: dust sheets, a clock stopped at some forgotten hour, a steel tiffin carrier on a shelf. At the top of the stairs stood a heavy wooden door with a padlock newer than the door itself.",
  "Someone had been replacing that lock for decades."]},
 {img:"p1s4.svg",text:[
  "That night the pipes knocked and I couldn’t sleep. I propped my phone on the pillow and started a voice recording. Pipes, or rats. I wanted to know which.",
  "I fell asleep at 1:40.",
  "At 2:17 I woke to the sound of a woman humming. It was slow, an old film melody, and it stopped one line before the end, then began again. I walked to the foot of the stairs. The moment my foot touched the first step, the humming stopped.",
  "I told myself it was the wind. But the wind doesn’t stop to wait."]},
 {img:"p1s5.svg",text:[
  "In the morning I played the recording over tea. The humming was there. Then a second voice, close to the microphone, sleepy and quiet. My own.",
  "> “I’m here. I’m sorry I’m late.”",
  "The humming stopped. Then my voice said one more word.",
  "> “Meera.”",
  "I never left that bed. And I have never known anyone called Meera."]}
]},
{title:"The Neighbour",meta:"Part 2 of 5 · about 5 min read",hook:"Through the window, Meera was still in the garden, looking at the house the way you look at a bus stop. She hadn’t moved in three hours.",scenes:[
 {text:[
  "I asked Selvam about it over breakfast.",
  "> “Did my grandfather ever mention someone called Meera?”",
  "The steel glass hit the floor.",
  "> “Where did you hear that name?”",
  "> “I just… heard it.”",
  "> “Sir never said it. Not once in forty years.” He picked up the glass without looking at me. “Eat.”",
  "He lied badly. People who lie well don’t drop things."]},
 {text:[
  "In the village, the tea stall went quiet when I walked in. An old man stared at me over his glass.",
  "> “You have his face.”",
  "> “Whose face?”",
  "He turned away.",
  "> “Finish your tea and go back before dark.”",
  "They weren’t looking at a stranger. They were looking at someone they had already met."]},
 {img:"p2s1.svg",text:[
  "That afternoon a woman was watering the jasmine in the garden with a steel pot. Faded blue saree, a long braid. Nothing about her looked strange.",
  "> “Sorry, are you from the village? I didn’t know anyone was staying in the outhouse.”",
  "> “I’m not staying. I live here.” She looked at my feet. “You’re standing on my jasmine.”",
  "> “Sorry! I’m Arjun.”",
  "> “Arjun.” She tried the name out. “That’s a big name for such a tired face. Have you eaten?”",
  "We talked. She knew which stair creaked and which window stuck. She laughed easily.",
  "> “Does the roof still leak in the west corner?”",
  "> “How do you know about the roof?”",
  "> “You promised to fix it before the rains, Raghu.”",
  "> “It’s Arjun. And I’ve been here one day.”",
  "> “Then you’re slow.” She smiled, unbothered. “It’s fine.”",
  "I should have asked more questions. I was too busy enjoying her answers."]},
 {text:[
  "That evening Selvam stood at the gate, grey in the face. He had been watching the garden for an hour and had not stepped inside it.",
  "> “Who were you talking to?”",
  "> “Meera. She’s staying in the outhouse.”",
  "> “Nobody has lived in that outhouse since 1964.”",
  "He brought out an old album. A loose photograph: a young man and a young woman beside a jasmine bush, a blue saree, a long braid. The man had my face. On the back, in pencil: Raghu and Meera. Before the monsoon.",
  "> “That is Raghavan sir. And that is Meera. The village says he killed her. I never believed it.” He paused. “But I never opened that door to check, either.”"]}
]},
{title:"The Handwriting",meta:"Part 3 of 5 · about 5 min read",hook:"In my pocket there was a small brass key. I never took it from anyone.",scenes:[
 {img:"p3s1.svg",text:[
  "On the third night Selvam came to my door with a cloth bundle.",
  "> “Sir left this with me. He said, when his grandson asks about Meera, give it to him.” He paused. “I have held it forty years. I thought I would be dead first.”",
  "Inside was Raghavan’s diary from 1964, and a sealed envelope with my name on it.",
  "> “The letter is not for tonight. Sir said it must be read out loud, to her. Not to yourself.”"]},
 {text:[
  "I read the diary by lamplight.",
  "> 3 May 1964. Father has found out about Meera. He says a cook’s daughter will not carry this family’s name. I leave for Madras tomorrow to finish my studies. Meera says she will wait. I told her I will come back before the rains and take her away.",
  "> 11 August 1964. The bus broke down on the ghat. I reached home at two in the morning. Someone was humming in the east room. I knew the song. She hummed the verse and I always answered with the last line. I stood at the door and heard her stop one line before the end, waiting for me. Father’s voice came from the corridor: Go to the car. Go, or you lose everything. I went to the car. I told myself I would return at dawn.",
  "> 12 August 1964. By dawn the east room had burned. A lamp, they say. The door was locked from outside. Father says she ran away. He is lying, and I know what I heard.",
  "> The last line, undated: I heard her. I stood at the door. I did not knock."]},
 {text:[
  "Turning the page, I found one more entry. The ink looked wet. It was dated today.",
  "> Day three. She waited again. I told her I will fix the roof.",
  "It was my grandfather’s handwriting exactly. I picked up a pen and signed my name on the lawyer’s papers. My signature now slanted the way his did. Earlier that day I had called Selvam “Selva” without thinking. No one had called him that except my grandfather."]},
 {text:[
  "Late that night, Meera was standing at the foot of the stairs with her pot.",
  "> “It’s late. Aren’t you going to open it tonight?”",
  "> “Open what?”",
  "> “The door, Raghu. You always stand there and never open it.”",
  "> “Tonight. I’ll open it tonight.”",
  "That wasn’t my voice. It wasn’t my sentence either."]}
]},
{title:"The Door",meta:"Part 4 of 5 · about 5 min read",hook:"The lamp on the stool began to tip.",scenes:[
 {text:[
  "At midnight I climbed the stairs with the key in my hand. Selvam caught my arm.",
  "> “Don’t. Sir stood on this step every August for sixty years and never turned that key.”",
  "> “She’s been waiting.”",
  "> “I know she has!”",
  "> “How do you know?”",
  "> “Because I was eight years old, sleeping in the kitchen that night. I heard her through the wall. My father put his hand over my mouth and said, Sleep.” His voice broke. “Meera was my sister.”",
  "Forty years of keeping the keys. Not as a servant. As a brother guarding a door he was never allowed to open."]},
 {text:[
  "Meera was at the top of the stairs. She looked at Selvam as if seeing him for the first time.",
  "> “Why does everyone stand outside? Who is this old man? Where is Selvam? He’s only a boy. He’ll catch a cold.”",
  "> “Akka…” Selvam whispered.",
  "She looked past him, back to me.",
  "> “Raghu, you said you would come back. And you came back. You’ll stay this time.”"]},
 {text:[
  "I tried to say my mother’s name. Nothing came. I tried to picture my flat in Chennai. What came instead was a bus ticket, a wet ghat road, the smell of kerosene.",
  "I tried to picture my mother’s face. I got a stranger’s father instead."]},
 {img:"p4s1.svg",text:[
  "The padlock fell open in my hand and the door swung in. The room wasn’t ruined. It was clean: a bed, a stool, a lamp. On the floorboards, hundreds of tally marks were scratched in rows. The last row was fresh.",
  "> “Sixty-two years,” I counted under my breath.",
  "I stepped in to look closer. The door shut behind me. From outside came the click of a lock. Meera’s palm was flat against the wood.",
  "> “No. Not again. This time you’ll stay where I can hear you.”",
  "She began to hum. Selvam hammered at the door. The smell of lamp oil filled the room. In the hall, the stopped clock began to tick toward 2:17."]}
]},
{title:"The Answer",meta:"Part 5 of 5 · the ending",hook:"The End.",scenes:[
 {text:[
  "Heat. Smoke. The lamp oil carried flame across the floorboards. It was a memory, but it burned like the real thing.",
  "> “Meera, open it!”",
  "The humming stopped.",
  "> “Say you’re not leaving.”",
  "> “I can’t say that!”",
  "> “Sir’s letter!” Selvam pushed an envelope under the door. “He said read it to her!”"]},
 {text:[
  "I coughed and read it aloud.",
  "> Meera. I stood outside your door on the night of the eleventh of August. I heard you. I told myself it was the wind. I have heard you every night for sixty years. I never came back to open the door because I did not deserve to see your face. I leave this house to my grandson. He looks like me. Forgive him for that. He is not me. Do not keep him. I never answered the last line. I am sorry."]},
 {text:[
  "Silence on the other side of the door.",
  "> “You’re not coming back.” Her voice was very small.",
  "> “No. He isn’t. He died in March. And I’m not Raghu. My name is Arjun. I live in Chennai. My mother’s name is Lakshmi.”",
  "As I said it, my mother’s face came back. My voice was my own again.",
  "> “I can’t stay here with you. But I won’t leave you in this room either.”",
  "> “Then who will answer?”"]},
 {img:"p5s1.svg",text:[
  "Outside the door, Selvam took a breath. Seventy years old, in a cracked, uneven voice, he sang the one line he had carried since he was eight, the line that was meant for Raghavan. He sang it once, all the way through.",
  "From inside the room, for the first time in sixty-two years, the humming finished the song.",
  "The lock clicked open. The flames went out as if they had never been there."]},
 {text:[
  "Meera stood in the corridor. No smoke, no burns. Her hair was damp, as if she had just come in from rain. She looked at the old man in front of her.",
  "> “Selva? You’re so old.”",
  "> “You left me waiting, Akka.”",
  "> “I know. I’m sorry.” She laughed, wet-eyed, and touched his cheek. “You grew.”",
  "She pressed my hand.",
  "> “Thank you for saying your own name.”",
  "She walked down the stairs and out into the garden. It was dawn. She stopped at the jasmine and did not turn around. A breeze moved through the leaves. White petals fell. She was gone."]},
 {text:[
  "Selvam knelt at the jasmine and performed the last rites no one had ever given her. I stood beside him. Later I signed a letter in my own handwriting, and it looked like mine again.",
  "That night, 2:17 AM, I lay awake. The house was silent.",
  "I didn’t sell it. Selvam says the east room should be somewhere people can sit and read, so I’m turning it into a small library for the village. The padlock is in a drawer. Selvam still doesn’t go upstairs. He says he doesn’t need to anymore."]}
]}
];
var S={part:0,size:20,theme:null};
function load(){try{var v=JSON.parse(localStorage.getItem("reader")||"{}");for(var k in v)S[k]=v[k]}catch(e){}}
function save(){try{localStorage.setItem("reader",JSON.stringify(S))}catch(e){}}
function esc(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function theme(){var t=S.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t)}
function size(){document.documentElement.style.setProperty("--fs",S.size+"px")}
function nav(){var h="";PARTS.forEach(function(p,i){h+='<button data-i="'+i+'"'+(i===S.part?' class="on"':'')+(p.soon?' disabled title="Coming soon"':'')+'>'+(i+1)+'. '+esc(p.title)+'</button>'});document.getElementById("nav").innerHTML=h}
function render(i,top){
  var p=PARTS[i];S.part=i;save();nav();var h='<div class="card"><div class="n">'+(i+1)+'</div><h1>'+esc(p.title)+'</h1><p class="meta">'+esc(p.meta||"")+'</p></div>';
  p.scenes.forEach(function(sc,k){
    if(sc.img)h+='<figure>Scene image: add '+esc(sc.img)+'<img src="'+sc.img+'" alt="" onerror="this.remove()"></figure>';
    sc.text.forEach(function(t){h+=t.charAt(0)===">"?'<p class="say">'+esc(t.slice(1).trim())+'</p>':'<p>'+esc(t)+'</p>'})
  });
  var nx=PARTS[i+1];
  h+='<p class="hook">'+esc(p.hook||"")+'</p><div class="end"><button id="pv"'+(i===0?' disabled':'')+'>Previous part</button>'+
   '<button id="nx"'+(!nx||nx.soon?' disabled':'')+'>'+(!nx?'The end':nx.soon?'Part '+(i+2)+' is coming soon':'Next part')+'</button></div>';
  document.getElementById("main").innerHTML=h;
  var pv=document.getElementById("pv"),nb=document.getElementById("nx");
  pv.onclick=function(){render(i-1,true)};nb.onclick=function(){render(i+1,true)};
  if(top)scrollTo(0,0);
}
document.getElementById("nav").onclick=function(e){var b=e.target.closest("button");if(b&&!b.disabled)render(+b.dataset.i,true)};
document.getElementById("sm").onclick=function(){S.size=Math.max(15,S.size-2);size();save()};
document.getElementById("lg").onclick=function(){S.size=Math.min(30,S.size+2);size();save()};
document.getElementById("th").onclick=function(){S.theme=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";theme();save()};
addEventListener("scroll",function(){var d=document.documentElement;document.getElementById("bar").style.width=(d.scrollTop/Math.max(1,d.scrollHeight-d.clientHeight)*100)+"%"});
load();if(!PARTS[S.part]||PARTS[S.part].soon)S.part=0;theme();size();render(S.part,false);
</script>
</body>
